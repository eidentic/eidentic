name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # read repository contents and create the GitHub Release for the tag
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Uses the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Node 24 ships npm 11.x — OIDC trusted publishing requires npm >= 11.5.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # NOTE: do NOT set node-auth-token — its presence disables the OIDC flow
          package-manager-cache: false

      - name: Verify npm OIDC-capable CLI
        run: node -e "const v=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) throw new Error('npm >=11.5.1 is required for trusted publishing');"

      # Runs install/build/test/typecheck/readme/audit, then publishes only versioned packages.
      # Provenance is attached automatically by npm trusted publishing via OIDC.
      - run: pnpm run release:publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --latest
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
          fi

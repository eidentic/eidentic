name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · test · typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm -r typecheck

      # Generated projects are a second public API. Compile the templates rather than only the
      # CLI implementation so dependency and tsconfig drift cannot ship.
      - name: Typecheck CLI templates
        if: matrix.node == '22'
        run: pnpm --filter @eidentic/cli typecheck:templates

      # Type-check TypeScript examples in all public Markdown against built package declarations.
      - name: Check documentation examples
        if: matrix.node == '22'
        run: pnpm check:readme

      - name: Check performance budgets
        if: matrix.node == '22'
        run: pnpm perf:budget

      # Test the tarballs, not workspace symlinks: ESM and CJS runtime loading plus Node16 and
      # NodeNext declaration resolution for every public export.
      - name: Test packed consumers
        if: matrix.node == '22'
        run: pnpm test:packed

      - name: Security audit
        if: matrix.node == '22'
        run: pnpm audit --audit-level low

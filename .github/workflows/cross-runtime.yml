name: Cross-runtime smoke (Bun + Deno)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-node:
    name: smoke · node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run smoke (Node)
        run: node scripts/runtime-smoke.mjs

  smoke-bun:
    name: smoke · bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run smoke (Bun)
        run: bun run scripts/runtime-smoke.mjs

  smoke-deno:
    name: smoke · deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run smoke (Deno)
        run: deno run --allow-read --allow-env scripts/runtime-smoke.mjs

# ─────────────────────────────────────────────────────────────────────────────
# Eidentic eval CI workflow
#
# What it does:
#   1. Runs `eidentic eval --ci` against your eval config file.
#   2. Compares the run against a committed baseline snapshot (.eidentic/eval-baseline.json).
#      If any (case, scorer) pair regresses beyond the tolerance the job fails.
#   3. Writes a Markdown eval report (eval-report.md) and posts/updates a single
#      sticky PR comment that is idempotently updated on every push.
#
# How to adopt:
#   - Copy this file to .github/workflows/eval.yml in your repo.
#   - Set EVAL_CONFIG to the relative path of your eval config file
#     (the file that exports { runner, dataset, scorers }).
#   - Add the model-provider secret (e.g. ANTHROPIC_API_KEY) to your repo's
#     Settings → Secrets and variables → Actions.
#   - Generate an initial baseline:
#       npx eidentic eval <your-config.ts> --save-baseline .eidentic/eval-baseline.json
#     then commit .eidentic/eval-baseline.json.
#   - Adjust PASS_THRESHOLD to your desired minimum pass rate (0–1).
#
# Optional: remove the --baseline flag if you don't want regression gating yet
# (the job will still run and post a report, but only fail on threshold violations).
# ─────────────────────────────────────────────────────────────────────────────

name: Eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Uncomment to allow manual triggering from the Actions tab:
  # workflow_dispatch:

# ── Customise these three variables ──────────────────────────────────────────
env:
  # Relative path to your eval config file (exports { runner, dataset, scorers }).
  EVAL_CONFIG: eval/my-eval.ts
  # Minimum acceptable aggregate pass rate (0–1). The CI job fails below this.
  PASS_THRESHOLD: "0.8"
  # Path to the committed baseline snapshot.
  BASELINE_PATH: .eidentic/eval-baseline.json
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  eval:
    name: Run evals
    runs-on: ubuntu-latest
    # Give the job write access to pull-request comments.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm   # or npm / yarn — match your project

      # ── 3. pnpm (remove if you use npm/yarn) ─────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      # ── 4. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Run evals ──────────────────────────────────────────────────────────
      # --ci           exit non-zero on threshold violation or regression
      # --threshold    minimum aggregate pass rate (0–1)
      # --baseline     compare against the committed baseline snapshot
      # --report       write a Markdown report for the PR comment below
      # --save-baseline  (optional) uncomment to update the baseline on main pushes
      - name: Run eidentic eval
        env:
          # Add your provider key here (set the secret in repo settings):
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          npx eidentic eval "$EVAL_CONFIG" \
            --ci \
            --threshold "$PASS_THRESHOLD" \
            --baseline "$BASELINE_PATH" \
            --report eval-report.md
          # Uncomment to auto-save the baseline on main pushes:
          # ${{ github.ref == 'refs/heads/main' && '--save-baseline "$BASELINE_PATH"' || '' }}

      # ── 6. Post / update the PR comment ───────────────────────────────────────
      # The Markdown report starts with <!-- eidentic-eval-report --> which lets
      # actions/github-script find and update the same comment idempotently
      # (no duplicate comments on repeated pushes).
      - name: Post eval report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Read the Markdown report generated by `eidentic eval --report`.
            const reportPath = 'eval-report.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No eval-report.md found — skipping comment.');
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const MARKER = '<!-- eidentic-eval-report -->';

            // Look for an existing comment from this workflow (idempotent).
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              // Update the existing comment so the PR thread stays clean.
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing eval comment (id=${existing.id}).`);
            } else {
              // First run — create a new comment.
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              console.log('Created new eval comment.');
            }

      # ── 7. Upload report as artifact (available on push to main too) ──────────
      - name: Upload eval report artifact
        if: always()   # upload even when the eval job fails
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
          if-no-files-found: ignore
